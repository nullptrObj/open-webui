services:
  lanyuechat:
    build:
      context: .
      dockerfile: Dockerfile
    image: harbor.houmo.ai/application_software/lanyuechat:v1.2.0
    container_name: lanyuechat
    volumes:
      - ./data/backend:/app/backend/data
    env_file:
      - .env
    network_mode: host
    restart: unless-stopped
